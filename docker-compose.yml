# Local infrastructure for RepoScribe development.
#   docker compose up -d
# Brings up Redis (BullMQ queue), Qdrant (vector store), and MinIO (S3-compatible
# object storage) so the server + worker can run fully locally without AWS.
services:
  redis:
    image: redis:7-alpine
    container_name: reposcribe-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: reposcribe-qdrant
    ports:
      - '6333:6333' # REST
      - '6334:6334' # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: reposcribe-minio
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio-data:/data

  # Creates the bucket the server expects on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/reposcribe-repos;
      echo 'bucket ready';
      "

volumes:
  redis-data:
  qdrant-data:
  minio-data:
